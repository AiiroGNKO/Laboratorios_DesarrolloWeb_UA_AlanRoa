<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>
    <Header>
        <nav>
            <ul class="menu">
                <li><a href="#hero">Inicio</a></li>
                <li><a href="#caracteristicas">Características</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="hero" class="hero">
            <div>
                <h2>Bienvenido</h2>
                <p>Landing Page del laboratorio de Desarrollo Web</p>
            </div>
        </section>
    </main>
    <section id="contacto">
        <h2>Contacto</h2>
        <form>
            <label for="nombre">Nombre</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                required>
    
            <label for="correo">Correo</label>
            <input
                type="email"
                id="correo"
                name="correo"
                required>
    
            <label for="mensaje">Mensaje</label>
            <textarea
                id="mensaje"
                name="mensaje"
                minlength="10"
                required></textarea>
    
            <button type="submit">Enviar</button>
    
        </form>
    </section>
    
</body>
</html>
